# lazedo fork: build the CSI driver image and publish it to GHCR.
#
# The Dockerfile is already arch-aware (it fetches the matching geesefs
# binary via TARGETARCH), so both arches come from the same recipe — each on a
# NATIVE runner, joined by digest into one manifest. No QEMU.
#
# Images carry the short commit SHA; a release additionally carries its tag.
name: image

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: csi-s3

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=csi-s3-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=csi-s3-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/csi-s3-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-csi-s3-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-csi-s3-*
          path: /tmp/digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}"
          TAGS="-t ${IMAGE}:${{ steps.sha.outputs.short }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${TAGS} -t ${IMAGE}:${{ github.ref_name }} -t ${IMAGE}:latest"
          elif [ "${{ github.ref_name }}" = "master" ]; then
            TAGS="${TAGS} -t ${IMAGE}:latest"
          fi
          # shellcheck disable=SC2046
          docker buildx imagetools create ${TAGS} \
            $(for f in /tmp/digests/*; do echo "${IMAGE}@$(cat "$f")"; done)
          docker buildx imagetools inspect "${IMAGE}:${{ steps.sha.outputs.short }}"
          echo "\`${IMAGE}:${{ steps.sha.outputs.short }}\` (amd64+arm64)" >> "$GITHUB_STEP_SUMMARY"

  # Publish the install manifests as an OCI artifact pinned to THIS commit's
  # image — the pin is generated here, never by hand, so image and manifest
  # cannot drift. Recovery is workflow_dispatch on a ref: it regenerates image
  # AND manifest for that same sha — never a "latest image" lookup, which
  # would couple a manifest at commit X with an image from commit Y.
  manifests:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: fluxcd/flux2/action@v2.9.2

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Assemble manifests pinned to this commit
        run: |
          set -euo pipefail
          SHORT="${{ steps.sha.outputs.short }}"
          mkdir -p /tmp/manifests
          for f in csi-s3.yaml driver.yaml provisioner.yaml; do
            sed -E "s#(image: ghcr\.io/lazedo/csi-s3):[^[:space:]]+#\\1:${SHORT}#" "deploy/kubernetes/${f}" > "/tmp/manifests/${f}"
          done
          grep -q "csi-s3:${SHORT}" /tmp/manifests/csi-s3.yaml

      - name: Push OCI artifact
        run: |
          set -euo pipefail
          flux push artifact "oci://ghcr.io/lazedo/manifests/csi-s3:${{ steps.sha.outputs.short }}" \
            --path /tmp/manifests \
            --source "${{ github.server_url }}/${{ github.repository }}" \
            --revision "${{ github.ref_name }}@sha1:${{ github.sha }}" \
            --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          if [ "${{ github.ref_name }}" = "master" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            flux tag artifact "oci://ghcr.io/lazedo/manifests/csi-s3:${{ steps.sha.outputs.short }}" \
              --tag latest --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          fi
